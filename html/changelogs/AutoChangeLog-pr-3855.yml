      ходить в софткрите, и суставная гиперфлексия, позволяющая залезть в вентиляцию
      при условии отсутствия снаряжения.'
  - rscdel: Отключён квирк "Недышащий".
  - rscdel: Отключён ген "Недышащий".
  - bugfix: Мутация генетики "Недышащий" получила фиксы от недавнего обновления квирка
      "Недышащий".
  - bugfix: ДНК-хранилище не даст юзеру выбрать оба улучшения.
